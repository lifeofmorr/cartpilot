<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CartPilot — PayPal return</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout" style="grid-template-columns: 1fr; max-width: 640px">
      <div class="card">
        <h2 id="title">Returning from PayPal…</h2>
        <p class="hint" id="body">One moment.</p>
        <p><a class="btn primary" href="/">Back to CartPilot</a></p>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token");
      const cancelled = location.pathname === "/cancel";
      document.getElementById("title").textContent = cancelled
        ? "Payment cancelled on PayPal"
        : "Approved on PayPal";
      document.getElementById("body").textContent = cancelled
        ? "The buyer cancelled on PayPal's page, so nothing was charged. Head back to CartPilot and run the agent again whenever you're ready."
        : `Order ${token || ""} is approved on PayPal. Head back to CartPilot and press "Capture payment" to finish — the agent verifies the approval with PayPal before capturing.`;
    </script>
  </body>
</html>
